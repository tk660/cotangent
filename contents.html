<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Contents - My Awesome 90s Site</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
<!-- Same setup as the other pages. This one shows how to make LISTS. -->

  <h1>Contents</h1>

  <hr>

  <!-- <h2> is a smaller heading than <h1>. -->
  <h2>What is on this site</h2>

  <!-- A BULLETED list:
         <ul> = the list        (unordered = bullets)
         <li> = one item        (list item)
       Each <li> here is also a link to another page. -->
  <ul style="list-style: none; font-size: 20px;">
    <li><a href="index.html">&#9654; Home</a></li>
    <li><a href="faq.html">&#9654; Frequently Asked Questions</a></li>
    <li><a href="contents.html">&#9654; Contents (you are here)</a></li>
  </ul>

  <hr>

  <h2>My top 3 episodes</h2>

  <!-- A NUMBERED list works the same, but uses <ol> (ordered) instead of <ul>. -->
  <ol style="font-size: 20px;">
    <li>The one with your favorite episode</li>
    <li>The one with another good episode</li>
    <li>The one you have seen 40 times</li>
  </ol>

  <hr>

  <p style="font-size: 20px;">
    <a href="index.html">Home</a> |
    <a href="faq.html">FAQ</a> |
    <a href="contents.html">Contents</a>
  </p>

</body>
</html>
